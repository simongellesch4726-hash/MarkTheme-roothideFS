name: Build and verify MarkTheme

on:
  push:
    branches:
      - main
    paths:
      - "Config.mk"
      - "Makefile"
      - "app/**"
      - "helper/**"
      - "iconservice/**"
      - "runtime/**"
      - "platform/**"
      - "scripts/**"
      - "tests/**"
      - "layout/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marktheme-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify packages
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Homebrew dependencies
        run: |
          brew install ldid

      - name: Install RootHide Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks"

      - name: Run host tests
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          ./tests/run

      - name: Build RootHide and rootless packages
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          ./scripts/build-packages roothide rootless

      - name: Verify package set
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d "" package; do
            found=$((found + 1))
            ./scripts/verify-package "$package"
          done < <(find "$GITHUB_WORKSPACE" -type f -name "*.deb" -print0)
          test "$found" -ge 2

      - name: Validate package architecture and RootHide payload
        run: |
          set -euo pipefail
          while IFS= read -r -d "" package; do
            echo "Inspecting $package"
            ar t "$package" | grep -Eq "^data\.tar"
            tmpdir="$(mktemp -d)"
            ar x "$package" --output "$tmpdir"
            data_archive="$(find "$tmpdir" -maxdepth 1 -name "data.tar*" -type f | head -n 1)"
            mkdir "$tmpdir/data"
            tar -xf "$data_archive" -C "$tmpdir/data"
            if [[ "$package" == *iphoneos-arm64e.deb ]]; then
              test ! -e "$tmpdir/data/var/jb"
            elif [[ "$package" == *iphoneos-arm64.deb ]]; then
              test -e "$tmpdir/data/var/jb"
            fi
            rm -rf "$tmpdir"
          done < <(find "$GITHUB_WORKSPACE" -type f -name "*.deb" -print0)

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: marktheme-0.3.1-packages
          if-no-files-found: error
          path: |
            **/*.deb
